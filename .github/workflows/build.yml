
name: Build Dirkhata APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Release APK
        run: |
          flutter create --org com.dirkhata.app --project-name dirkhata app_runner
          cd app_runner
          flutter pub add intl url_launcher
          cp ../lib/main.dart lib/main.dart
          flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: Dirkhata-App
          path: app_runner/build/app/outputs/flutter-apk/app-release.apk
